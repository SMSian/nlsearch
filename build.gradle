plugins {
    id 'java'
    id 'maven-publish'
}

group = 'org.aeruto'
version = findProperty('pluginVersion') ?: '0.31'

// A plugin only loads into the exact Elasticsearch version it was built for,
// so there is one release per ES version, named <plugin version>-<es version>.
// Build for another one with -PesVersion=9.x.y
ext {
    esVersion = findProperty('esVersion') ?: '9.5.5'
    langchain4jVersion = '1.21.0'
}

repositories {
    mavenCentral()
}

java {
    withSourcesJar()   // so anyone reading the plugin can step into it from their IDE
}

dependencies {
    // provided by the Elasticsearch node at runtime, so compileOnly
    compileOnly "org.elasticsearch:elasticsearch:${esVersion}"

    // one langchain4j module per supported provider; they share the core + jdk http client
    implementation "dev.langchain4j:langchain4j-ollama:${langchain4jVersion}"
    implementation "dev.langchain4j:langchain4j-open-ai:${langchain4jVersion}"
    implementation "dev.langchain4j:langchain4j-anthropic:${langchain4jVersion}"
    implementation "dev.langchain4j:langchain4j-google-ai-gemini:${langchain4jVersion}"

    testImplementation "org.elasticsearch:elasticsearch:${esVersion}"
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// runs on the JDK that ships with Elasticsearch, so the bytecode is 21 whatever JDK builds it (needs 21 or newer)
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
    testLogging {
        events('passed', 'skipped', 'failed')
        exceptionFormat = 'full'
    }
}

// Builds the zip that `elasticsearch-plugin install` understands:
// our jar, every runtime dependency, plugin-descriptor.properties and
// entitlement-policy.yaml, all at the root of the archive.
tasks.register('bundle', Zip) {
    dependsOn jar
    archiveFileName = "nlsearch-${project.version}-${esVersion}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from jar
    from configurations.runtimeClasspath
    from('src/main/plugin-metadata') {
        expand(version: "${project.version}-${esVersion}", esVersion: esVersion)
    }
}

// Publishes to GitHub Packages, which is the Maven repository attached to this
// repository. The release workflow does it on every tag; by hand it needs a
// classic token with write:packages:
//   GITHUB_ACTOR=<you> GITHUB_TOKEN=<token> ./gradlew publish
//
// The version is the same <plugin>-<elasticsearch> as the release, so one
// coordinate pins both: org.aeruto:nlsearch:0.31-9.5.5
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'nlsearch'
            version = "${project.version}-${esVersion}"

            // the installable zip, next to the jar
            artifact(tasks.named('bundle')) {
                classifier = 'plugin'
                extension = 'zip'
            }

            // this is what shows on the package page, so it is written for someone landing there cold
            pom {
                name = 'nlsearch'
                description = 'An Elasticsearch plugin that adds a _nl endpoint: you send a sentence, a language ' +
                    'model turns it into the matching Elasticsearch action, the plugin runs it, and you get back ' +
                    'both a plain-English answer and the Elasticsearch response. Covers search, indexing, bulk, ' +
                    'update, delete, update by query, delete by query, index creation, deletion and mappings. ' +
                    'The model can be Ollama on localhost, OpenAI, Anthropic, Gemini or any OpenAI compatible ' +
                    'server, chosen in elasticsearch.yml. An optional session keeps the conversation so follow-ups ' +
                    'like "now only the ones in stock" work. Built for Elasticsearch ' + esVersion + '; install the ' +
                    '-plugin.zip artifact with elasticsearch-plugin, the jar alone is for reading and extending.'
                url = 'https://sheikmohammedsha.github.io/nlsearch/'
                inceptionYear = '2026'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
                developers {
                    developer {
                        id = 'SMSian'
                        name = 'Shaw'
                        url = 'https://github.com/sheikmohammedsha'
                    }
                }
                scm {
                    url = 'https://github.com/sheikmohammedsha/nlsearch'
                    connection = 'scm:git:https://github.com/sheikmohammedsha/nlsearch.git'
                    developerConnection = 'scm:git:git@github.com:sheikmohammedsha/nlsearch.git'
                }
                issueManagement {
                    system = 'GitHub Issues'
                    url = 'https://github.com/sheikmohammedsha/nlsearch/issues'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/sheikmohammedsha/nlsearch'
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}
